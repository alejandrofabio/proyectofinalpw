<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Profesores')}"></head>
<body>
	<nav th:replace="~{layout :: menu}"></nav>
	<main class="container mt-5">
		<div class="card shadow">
			<div class="card-header encabezado">
				<h1 class="h3">Listado de profesores</h1>
			</div>
			<div class="card-body">
				<a class="btn btn-success mb-3" th:href="@{/profesor/nuevo}">Nuevo</a>
				<div class="table-responsive">
					<table class="table table-hover table-striped">
						<thead class="table-dark">
							<tr>
								<th>ID</th>
								<th>NOMBRE COMPLETO</th>
								<th>PROFESIÓN</th>
								<th>COLEGIADO</th>
								<th>DIRECCIÓN</th>
								<th>TELÉFONO</th>
								<th>ACCIONES</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="p : ${profesores}">
								<td th:text="${p.id}"></td>
								<td th:text="${p.nombreCompleto}"></td>
								<td th:text="${p.profesion}"></td>
								<td th:text="${p.colegiado}"></td>
								<td th:text="${p.direccion}"></td>
								<td th:text="${p.telefono}"></td>
								<td>
									<a class="btn btn-sm btn-warning" th:href="@{/profesor/editar/{id}(id=${p.id})}">Editar</a>
									<a class="btn btn-sm btn-danger" th:href="@{/profesor/eliminar/{id}(id=${p.id})}">Eliminar</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>
	<footer th:replace="~{layout :: pie}"></footer>
</body>
</html>
