<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Alumnos')}"></head>
<body>
	<nav th:replace="~{layout :: menu}"></nav>
	<main class="container mt-5">
		<div class="card shadow">
			<div class="card-header encabezado">
				<h1 class="h3">Listado de alumnos</h1>
			</div>
			<div class="card-body">
				<a class="btn btn-success mb-3" th:href="@{/alumno/nuevo}">Nuevo</a>
				<div class="table-responsive">
					<table class="table table-hover table-striped">
						<thead class="table-dark">
							<tr>
								<th>ID</th>
								<th>NOMBRE COMPLETO</th>
								<th>CARNÉ</th>
								<th>DIRECCIÓN</th>
								<th>FACULTAD</th>
								<th>OBSERVACIONES</th>
								<th>ACCIONES</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="a : ${alumnos}">
								<td th:text="${a.id}"></td>
								<td th:text="${a.nombreCompleto}"></td>
								<td th:text="${a.carne}"></td>
								<td th:text="${a.direccion}"></td>
								<td th:text="${a.facultad}"></td>
								<td th:text="${a.observaciones}"></td>
								<td>
									<a class="btn btn-sm btn-warning" th:href="@{/alumno/editar/{id}(id=${a.id})}">Editar</a>
									<a class="btn btn-sm btn-danger" th:href="@{/alumno/eliminar/{id}(id=${a.id})}">Eliminar</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>
	<footer th:replace="~{layout :: pie}"></footer>
</body>
</html>
