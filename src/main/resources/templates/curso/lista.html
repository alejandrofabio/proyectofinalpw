<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Cursos')}"></head>
<body>
	<nav th:replace="~{layout :: menu}"></nav>
	<main class="container mt-5">
		<div class="card shadow">
			<div class="card-header encabezado">
				<h1 class="h3">Listado de cursos</h1>
			</div>
			<div class="card-body">
				<a class="btn btn-success mb-3" th:href="@{/curso/nuevo}">Nuevo</a>
				<div class="table-responsive">
					<table class="table table-hover table-striped">
						<thead class="table-dark">
							<tr>
								<th>ID</th>
								<th>NOMBRE</th>
								<th>HORARIO</th>
								<th>SALÓN</th>
								<th>FACULTAD</th>
								<th>PROFESOR</th>
								<th>ALUMNOS</th>
								<th>ACCIONES</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="c : ${cursos}">
								<td th:text="${c.id}"></td>
								<td th:text="${c.nombre}"></td>
								<td th:text="${c.horario}"></td>
								<td th:text="${c.salon}"></td>
								<td th:text="${c.facultad}"></td>
								<td th:text="${c.profesor != null} ? ${c.profesor.nombreCompleto} : 'Sin asignar'"></td>
								<td><span class="badge bg-primary" th:text="${c.alumnos.size()}"></span></td>
								<td>
									<a class="btn btn-sm btn-info" th:href="@{/curso/ver/{id}(id=${c.id})}">Ver</a>
									<a class="btn btn-sm btn-warning" th:href="@{/curso/editar/{id}(id=${c.id})}">Editar</a>
									<a class="btn btn-sm btn-danger" th:href="@{/curso/eliminar/{id}(id=${c.id})}">Eliminar</a>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</main>
	<footer th:replace="~{layout :: pie}"></footer>
</body>
</html>
