<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${titulo}">Universidad Regional</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
	<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark">
		<div class="container">
			<a class="navbar-brand" th:href="@{/}">Universidad Regional de Guatemala</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="menuPrincipal">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/alumno/listar}">Alumnos</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/profesor/listar}">Profesores</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/curso/listar}">Cursos</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<footer th:fragment="pie" class="text-center py-3 mt-5">
		Universidad Regional de Guatemala
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</footer>
</body>
</html>
